{% extends "dashboard/base-layout.html" %}
{% load bootstrap3 i18n %}


    {% block page_title %}Accounts{% endblock %}

    {% block page_content %}
        <div class="row">
            <div class="col-md-12">
                <div class="box box-primary">
                    <div class="box-header with-border">
                        <h3 class="box-title">Documents</h3>
                    </div>
                    <div class="box-body no-padding">
                        <table class="table table-striped">
                            <tbody>
                                <tr>
                                    <th></th>
                                    <th>Name</th>
                                </tr>
                                {% for pdf in object_list %}
                                <tr>
                                    <td>
                                        {% if pdf.file %}
                                            <a href="{% url "account:inbox_document" pdf.id %}" class="btn btn-info"><i class="fa fa-file-pdf-o"></i></a>
                                        {% endif %}
                                    </td>
                                    <td>{{ pdf.name }}</td>
                                </tr>
                                {% endfor %}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    {% endblock %}
